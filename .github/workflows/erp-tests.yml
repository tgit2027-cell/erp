
name: TAI-ERP Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Inspect repository
        run: |
          echo "Repository root:"
          ls -la
          echo "Django project locations:"
          find . -name manage.py \
            -not -path '*/.venv/*' \
            -not -path '*/node_modules/*'
          echo "Dependency files:"
          find . -maxdepth 3 \
            \( -name requirements.txt \
            -o -name pyproject.toml \) \
            -not -path '*/.venv/*'

      # Add dependency installation and test commands
      # after confirming the actual project paths.

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Inspect frontend
        run: |
          find . -name package.json \
            -not -path '*/node_modules/*' \
            -not -path '*/.venv/*'
          echo "Inspect package scripts before configuring npm."

      # Add Node setup, npm ci, unit tests,
      # test:audit-log-ui, typecheck, build,
      # and sidebar-browser after confirming package.json.
