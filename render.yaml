databases:
  - name: tivoli-erp-db
    databaseName: tivoli_erp
    user: tivoli_erp
    postgresMajorVersion: "16"
    region: oregon
    plan: 0.1c-256mb
    ipAllowList: []

services:
  - type: web
    name: tivoli-erp
    runtime: python
    region: oregon
    plan: 0.5c-512mb
    buildCommand: bash build.sh
    startCommand: bash scripts/render_start.sh
    healthCheckPath: /healthz/
    disk:
      name: tivoli-erp-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: demo
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tivoli-erp-db
          property: connectionString
      - key: RENDER_INITIAL_ADMIN_PASSWORD
        sync: false
      - key: DJANGO_MEDIA_ROOT
        value: /var/data/media
      - key: DJANGO_COOKIE_SECURE
        value: "true"
      - key: AUDIT_TRUST_X_FORWARDED_FOR
        value: "true"
